<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#A51C30">
    <title>Harvard Connect Four</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Connect Four</h1>
        </header>

        <div class="game-info">
            <div class="score-board">
                <div class="score-item">
                    <span class="score-label">Wins</span>
                    <span id="wins" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Losses</span>
                    <span id="losses" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Draws</span>
                    <span id="draws" class="score-value">0</span>
                </div>
            </div>

            <div class="controls">
                <select id="difficulty" class="difficulty-select">
                    <option value="easy">Easy AI</option>
                    <option value="medium" selected>Medium AI</option>
                    <option value="hard">Hard AI</option>
                </select>
                <button id="newGame" class="btn-primary">New Game</button>
                <button id="resetScores" class="btn-secondary">Reset Scores</button>
            </div>
        </div>

        <div class="game-status" id="gameStatus">Your turn</div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <footer>
            <p>© 2025 Harvard Connect Four | CS1060</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
